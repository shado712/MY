<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى أختي بطلة السادس</title>
    <style>
        :root { --study-blue: #1e3c72; --gold: #d4af37; --white: #ffffff; }
        body { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            margin: 0; font-family: 'Arial', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; color: white;
        }

        /* مؤثرات الدراسة المتساقطة */
        .study-icons { position: fixed; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .icon { position: absolute; animation: fall linear infinite; opacity: 0.6; font-size: 25px; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .container { 
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            padding: 30px; border-radius: 35px; border: 2px solid var(--gold);
            width: 85%; max-width: 450px; text-align: center; position: relative; z-index: 10;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .main-img { width: 140px; margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--gold)); }
        h1 { color: var(--gold); font-size: 24px; text-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        p { font-size: 18px; line-height: 1.8; min-height: 120px; font-weight: bold; }
        .btn { 
            background: var(--gold); color: #1e3c72; border: none; padding: 15px; 
            border-radius: 25px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer;
            transition: 0.3s; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
        .btn:hover { transform: translateY(-3px); background: #f1c40f; }
    </style>
</head>
<body>

    <div class="study-icons" id="icons"></div>

    <div class="container">
        <img src="https://media.tenor.com/OnY_qNqE4p8AAAAi/hello-kitty-shy.gif" class="main-img" id="gif">
        <h1 id="title">إلى أختي الغالية 🎓</h1>
        <p id="text">أدري السادس تعبج، وأدري الحمل ثقيل.. بس أنتي بطلة وحلمج يستاهل كل لحظة سهر وتعب.</p>
        <button class="btn" onclick="nextMessage()">اضغطي يا دكتورة المستقبل ✨</button>
    </div>

        // توليد مؤثرات الدراسة
        const icons = ['📚', '✍️', '🎓', '📝', '💡', '📖'];
        setInterval(() => {
            const i = document.createElement('div');
            i.className = 'icon';
            i.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            i.style.left = Math.random() * 100 + 'vw';
            i.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.getElementById('icons').appendChild(i);
            setTimeout(() => i.remove(), 6000);
        }, 400);
